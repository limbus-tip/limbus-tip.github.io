<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limbus Tip</title>
  <link rel="icon" type="image/png" href="limbus-tip.png">

  <!-- 다크모드는 화면이 그려지기 전에 먼저 적용해야 깜빡이지 않는다 -->
  <!-- 파일 이름의 대소문자가 실제 파일(Theme.js / Theme.css)과 똑같아야 한다 -->
  <script src="Theme.js"></script>

  <link rel="stylesheet" href="Theme.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <!-- 로고 전체가 버튼: 누르면 메인으로 -->
    <a class="logo" href="/" aria-label="Limbus Tip 메인으로">
      LIMBUS
      <span>TIP</span>
    </a>

    <nav class="main-nav">
      <a href="Identity/">인격 정보</a>
    </nav>

    <div class="header-right">
      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="다크모드"
      >
        <!-- 달 아이콘 (라이트 모드일 때 보임) -->
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <!-- 해 아이콘 (다크 모드일 때 보임) -->
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="theme-toggle-label">다크모드 OFF</span>
      </button>
    </div>

  </header>

  <main class="container">

    <!-- 디스코드 커뮤니티 참가 화면 -->
    <section class="community">
      <h1 class="community-title">Limbus Tip 커뮤니티</h1>
      <p class="community-text">
        림버스 컴퍼니의 팁과 정보를 함께 나누는<br>
        디스코드 커뮤니티에 참여해 보세요.
      </p>

      <a
        class="discord-button"
        href="https://discord.gg/UQ99VPANHH"
        target="_blank"
        rel="noopener noreferrer"
      >
        <!-- 디스코드 아이콘 -->
